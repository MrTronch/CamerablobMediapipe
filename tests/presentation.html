<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de presentación</title><link rel="stylesheet" href="../style.css"><body><header>Prueba de pantalla completa</header><section class="stage"><canvas id="view" width="640" height="480"></canvas><div class="hud" data-debug>FPS / MANOS / CARAS</div><button id="exitFullscreen" hidden>✕ Salir</button></section><button id="fullscreen">Pantalla completa</button><p id="result">Modo normal</p><script type="module">import {setupPresentation} from '../presentation.js';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.fillStyle='#153015';ctx.fillRect(0,0,640,480);ctx.strokeStyle='#7bff62';ctx.beginPath();ctx.arc(320,240,100,0,Math.PI*2);ctx.stroke();setupPresentation({stage:document.querySelector('.stage'),button:document.querySelector('#fullscreen'),exitButton:document.querySelector('#exitFullscreen'),onResize:()=>document.querySelector('#result').textContent=document.fullscreenElement?'Pantalla completa activa':'Modo normal',onError:message=>document.querySelector('#result').textContent=message});</script></body></html>
