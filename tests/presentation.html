<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de proporciones</title><link rel="stylesheet" href="../style.css"><body><div class="app-shell"><header>Prueba de encuadre completo: deben verse las cuatro esquinas y un círculo sin deformar.</header><section class="stage camera-active" style="--camera-ratio:1.3333333333"><canvas id="view" width="640" height="480"></canvas><button id="exitFullscreen" hidden>×</button></section><div class="menu-bar"><button id="fullscreen">Pantalla completa</button><button id="portrait">Fuente vertical</button><button id="landscape">Fuente horizontal</button></div><p id="result">Modo normal</p></div><script type="module">
import {setupPresentation} from '../presentation.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('.stage');
function paint(w,h){canvas.width=w;canvas.height=h;stage.style.setProperty('--camera-ratio',w/h);ctx.fillStyle='#161020';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#b897ff';ctx.lineWidth=4;ctx.strokeRect(3,3,w-6,h-6);ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)*.3,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='24px Arial';ctx.textBaseline='top';ctx.fillText('1',12,12);ctx.fillText('2',w-28,12);ctx.fillText('3',12,h-38);ctx.fillText('4',w-28,h-38);}
paint(640,480);document.getElementById('portrait').onclick=()=>paint(480,640);document.getElementById('landscape').onclick=()=>paint(640,480);
setupPresentation({stage,button:document.querySelector('#fullscreen'),exitButton:document.querySelector('#exitFullscreen'),onResize:()=>document.querySelector('#result').textContent=document.fullscreenElement?'Pantalla completa activa':'Modo normal',onError:message=>document.querySelector('#result').textContent=message});
</script></body></html>
