<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de deformación por pinza</title><style>body{margin:24px;background:#100d17;color:#ddd;font:14px Arial}canvas{display:block;width:min(100%,960px);margin-top:20px}input{margin:16px;width:200px}button{padding:12px}</style><h1>Pinza · deformación del rostro</h1><p>Fuente y puntos sintéticos; usa el mismo módulo de la aplicación.</p><label>Separación X<input id="x" type="range" min=".2" max=".8" step=".005" value=".55"></label><label>Separación Y<input id="y" type="range" min=".15" max=".75" step=".005" value=".4"></label><button id="lost">Perder detección</button><canvas id="view" width="960" height="540"></canvas><script type="module">
import {createFaceStretch} from '../face-stretch.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),source=document.createElement('canvas');source.width=960;source.height=540;const sc=source.getContext('2d');
sc.fillStyle='#231d2c';sc.fillRect(0,0,960,540);sc.fillStyle='#b38774';sc.beginPath();sc.ellipse(480,280,150,205,0,0,Math.PI*2);sc.fill();for(const x of [420,540]){sc.fillStyle='#eee';sc.beginPath();sc.ellipse(x,235,30,17,0,0,Math.PI*2);sc.fill();sc.fillStyle='#243d37';sc.beginPath();sc.arc(x,235,12,0,Math.PI*2);sc.fill();}sc.fillStyle='#512c34';sc.beginPath();sc.ellipse(480,365,40,15,0,0,Math.PI*2);sc.fill();
const f=Array.from({length:468},()=>({x:.5,y:.5}));f[234]={x:.34,y:.5};f[454]={x:.66,y:.5};f[10]={x:.5,y:.14};f[152]={x:.5,y:.9};for(const p of f)p.visibility=0;
function hand(dx,dy){const h=Array.from({length:21},()=>({x:.65,y:.6}));h[5]={x:.6,y:.6};h[17]={x:.7,y:.6};h[4]={x:.6,y:.45};h[8]={x:.6+dx,y:.45+dy};return h;}
const proof=document.createElement('output');proof.style.cssText='display:block;padding:12px';document.querySelector('canvas').before(proof);
const dip=document.createElement('button');dip.textContent='Simular pérdida de 200 ms';document.querySelector('canvas').before(dip);dip.onclick=()=>{lost=true;setTimeout(()=>lost=false,200);};
const stretch=createFaceStretch();let lost=false;function render(){const now=performance.now();const dx=+document.getElementById('x').value,dy=+document.getElementById('y').value;const a=hand(.02,.02),b=hand(.02,.02);a[4]={x:.5-dx/2,y:.5+dy/2};a[8]={x:.5-dx/2,y:.5-dy/2};b[4]={x:.5+dx/2,y:.5+dy/2};b[8]={x:.5+dx/2,y:.5-dy/2};for(const h of [a,b])for(const p of h)p.visibility=0;stretch.update(lost?[]:[a,b],f,now,960,540);ctx.drawImage(source,0,0);stretch.draw(ctx,source,now,1.5);const scale=stretch.scale();proof.textContent=`${stretch.isActive()?'ACTIVO':'INACTIVO'} · Escala X ${scale.x.toFixed(2)} · Escala Y ${scale.y.toFixed(2)}`;requestAnimationFrame(render);}
document.getElementById('lost').onclick=()=>{lost=!lost;document.getElementById('lost').textContent=lost?'Recuperar detección':'Perder detección';};render();
</script></html>
