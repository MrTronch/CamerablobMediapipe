<!doctype html><html lang="es"><meta charset="utf-8"><title>Medición del fondo</title><style>body{background:#100d17;color:#ddd;font:16px Arial;padding:30px}button{padding:15px}output{white-space:pre-line;display:block;margin:20px 0}</style><h1>Coste del fondo procedural</h1><p>Compara configuraciones del mismo generador. No mide FPS de cámara ni usa cámara.</p><button id="run">Medir configuraciones</button><output id="result">En espera</output><script type="module">
import {createFieldRenderer} from '../atmosphere-field.js';
const button=document.getElementById('run'),result=document.getElementById('result');
async function measure(options){const canvas=document.createElement('canvas'),draw=createFieldRenderer(canvas,options),times=[];for(let i=0;i<12;i++){await new Promise(resolve=>requestAnimationFrame(resolve));const start=performance.now();draw({now:i*100,audio:{level:.2,bass:.2,treble:.1},targets:[{x:.4,y:.5},{x:.6,y:.4}],motion:1});if(i>=4)times.push(performance.now()-start);}times.sort((a,b)=>a-b);return times[Math.floor(times.length/2)];}
button.onclick=async()=>{button.disabled=true;result.textContent='Midiendo…';const before=await measure({width:640,height:360,columns:5,rows:4});const after=await measure({});result.textContent=`Configuración anterior: ${before.toFixed(2)} ms por fotograma de fondo\nConfiguración optimizada: ${after.toFixed(2)} ms\nReducción: ${(100*(1-after/before)).toFixed(1)} %\nEl fondo de la app se ejecuta además en un worker cuando el navegador lo permite.`;button.disabled=false;};
</script></html>
