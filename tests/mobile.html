<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vista móvil</title><style>body{margin:16px;background:#15121c;color:white;font:14px Arial}iframe{display:block;border:1px solid #555;margin-top:14px}button{padding:10px;margin-right:8px}output{display:block;margin-top:12px}</style><p>Prueba de diseño adaptable. No emula Safari ni hardware de iPhone.</p><button data-w="375" data-h="667">375 × 667</button><button data-w="393" data-h="852">393 × 852</button><button data-w="852" data-h="393">852 × 393</button><output id="result"></output><iframe id="phone" width="393" height="852" src="../index.html"></iframe><script>
const frame=document.getElementById('phone'),result=document.getElementById('result');function measure(){const doc=frame.contentDocument;if(doc)result.textContent=`Ancho ${doc.documentElement.clientWidth} / contenido ${doc.documentElement.scrollWidth} / ${doc.documentElement.scrollWidth<=doc.documentElement.clientWidth?'PASS sin desbordamiento':'FAIL desbordamiento'}`;}frame.onload=measure;for(const button of document.querySelectorAll('button'))button.onclick=()=>{frame.width=button.dataset.w;frame.height=button.dataset.h;requestAnimationFrame(()=>requestAnimationFrame(measure));};
</script></html>
