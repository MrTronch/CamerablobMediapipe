<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de ojo y feedback</title><style>body{margin:24px;background:#100d17;color:#ddd;font:14px Arial}canvas{display:block;width:min(100%,960px);margin-top:20px;background:#181120}button,input{margin:10px;padding:12px}input{width:300px}</style><h1>Ojo en la frente · fuente sintética</h1><p>La prueba usa el mismo módulo de la aplicación. Arrastra el tiempo para verificar el rastro y cada recorte fijo y opaco, y su retirada individual al cumplir 10 segundos.</p><label>Tiempo <input id="time" type="range" min="0" max="20500" step="50" value="2000"><output id="value">2000 ms</output></label><canvas id="view" width="960" height="540"></canvas><script type="module">
import {createThirdEye} from '../third-eye.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),source=document.createElement('canvas');source.width=960;source.height=540;const sc=source.getContext('2d');
function face(t,open){const f=Array.from({length:468},()=>({x:.5,y:.5}));const dx=Math.sin(t/900)*.035;for(const [i,x,y]of [[10,.5,.15],[9,.5,.3],[33,.37,.41],[133,.43,.41],[159,.4,.39],[145,.4,.43],[263,.63,.41],[13,.5,.62],[14,.5,open?.7:.63]])f[i]={x:x+dx,y};return f;}
function paint(t){const dx=Math.sin(t/900)*.035*960;sc.fillStyle='#231d2c';sc.fillRect(0,0,960,540);sc.fillStyle='#b38774';sc.beginPath();sc.ellipse(480+dx,295,165,220,0,0,Math.PI*2);sc.fill();for(const x of [384,576]){sc.fillStyle='#eee6dc';sc.beginPath();sc.ellipse(x+dx,221,34,17,0,0,Math.PI*2);sc.fill();sc.fillStyle='#4b684c';sc.beginPath();sc.arc(x+dx,221,14,0,Math.PI*2);sc.fill();sc.fillStyle='#101012';sc.beginPath();sc.arc(x+dx,221,7,0,Math.PI*2);sc.fill();sc.strokeStyle='#49332c';sc.lineWidth=5;sc.beginPath();sc.ellipse(x+dx,221,35,18,0,Math.PI,Math.PI*2);sc.stroke();}sc.fillStyle='#372026';sc.beginPath();sc.ellipse(480+dx,355,42,28,0,0,Math.PI*2);sc.fill();}
function render(){const t=+document.getElementById('time').value;document.getElementById('value').value=t+' ms';const eye=createThirdEye();for(let now=0;now<=t;now+=50){paint(now);eye.update(face(now,true),now,960,540);ctx.drawImage(source,0,0);eye.draw(ctx,source,now);}}
document.getElementById('time').oninput=render;render();
</script></html>
