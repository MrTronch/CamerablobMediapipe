<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de capas e inversión</title><style>body{margin:24px;background:#100d17;color:#ddd;font:14px Arial}canvas{display:block;width:min(100%,960px);margin-top:20px;background:#181120}button,input{margin:10px;padding:12px}input{width:300px}</style><h1>Ojo superior + inversión exterior · fuente sintética</h1><p>La prueba usa el mismo módulo de la aplicación. Arrastra el tiempo para verificar el rastro y cada recorte fijo y opaco, y su retirada individual durante los últimos 350 ms de una secuencia de 5 segundos.</p><label>Tiempo <input id="time" type="range" min="0" max="5500" step="50" value="2000"><output id="value">2000 ms</output></label><label><input id="mono" type="checkbox">Blanco y negro</label><canvas id="view" width="960" height="540"></canvas><script type="module">
import {createThirdEye} from '../third-eye.js';
import {createFaceStretch} from '../face-stretch.js';
import {createCameraFilter} from '../camera-filter.js';
import {invertOutside,createFrameTrail,drawFrameOutlines} from '../compositing.js';
const cameraFilter=createCameraFilter();
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),source=document.createElement('canvas');source.width=960;source.height=540;const sc=source.getContext('2d');
function face(t,open){const f=Array.from({length:468},()=>({x:.5,y:.5}));const dx=Math.sin(t/900)*.035;for(const [i,x,y]of [[234,.34,.5],[454,.66,.5],[152,.5,.94],[10,.5,.15],[9,.5,.3],[33,.37,.41],[133,.43,.41],[159,.4,.39],[145,.4,.43],[263,.63,.41],[13,.5,.62],[14,.5,open?.7:.63]])f[i]={x:x+dx,y};return f;}
function paint(t){const dx=Math.sin(t/900)*.035*960;sc.fillStyle='#231d2c';sc.fillRect(0,0,960,540);sc.fillStyle='#b38774';sc.beginPath();sc.ellipse(480+dx,295,165,220,0,0,Math.PI*2);sc.fill();for(const x of [384,576]){sc.fillStyle='#eee6dc';sc.beginPath();sc.ellipse(x+dx,221,34,17,0,0,Math.PI*2);sc.fill();sc.fillStyle='#4b684c';sc.beginPath();sc.arc(x+dx,221,14,0,Math.PI*2);sc.fill();sc.fillStyle='#101012';sc.beginPath();sc.arc(x+dx,221,7,0,Math.PI*2);sc.fill();sc.strokeStyle='#49332c';sc.lineWidth=5;sc.beginPath();sc.ellipse(x+dx,221,35,18,0,Math.PI,Math.PI*2);sc.stroke();}sc.fillStyle='#372026';sc.beginPath();sc.ellipse(480+dx,355,42,28,0,0,Math.PI*2);sc.fill();}
function hands(t){return [.28,.72].map(x=>{const h=Array.from({length:21},()=>({x,y:.65}));h[4]={x:x+Math.sin(t/600)*.12,y:.68};h[8]={x:x+Math.sin(t/600)*.12,y:.25};h[5]={x:x-.05,y:.65};h[17]={x:x+.05,y:.65};return h;});}
function render(){const t=+document.getElementById('time').value,mono=document.getElementById('mono').checked;document.getElementById('value').value=t+' ms';const eye=createThirdEye(),stretch=createFaceStretch(),trail=createFrameTrail();for(let now=0;now<=t;now+=50){paint(now);const f=face(now,true);eye.update(f,now,960,540);stretch.update(hands(now),f,now,960,540);const image=cameraFilter.image(source,mono,now);ctx.drawImage(image,0,0);const rect=stretch.draw(ctx,image,now,0);const copies=trail.draw(ctx,image,rect,now);invertOutside(ctx,960,540,rect,1.5);cameraFilter.grain(ctx,960,540,now,mono);drawFrameOutlines(ctx,copies,1.5);eye.draw(ctx,image,now,mono);}}
document.getElementById('time').oninput=render;document.getElementById('mono').onchange=render;render();
</script></html>
